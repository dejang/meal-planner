id: string-union-type-tsx
language: tsx
severity: error
message: "A closed set of string values is a regular string `enum`: not a union of string literals, and never a `const enum`, as Vite transpiles one file at a time (T2)."
files:
  - "ui/src/components/**"
  - "ui/src/stores/**"
  - "ui/src/features/**"
  - "ui/src/mobile/**"
  - "ui/src/App.tsx"
  - "ui/src/App.test.tsx"
# A union that mixes in any other type (`MenuItem | MenuSeparator`, `"a" | null`) is allowed.
utils:
  string-member:
    kind: literal_type
    has:
      kind: string
  string-union:
    kind: union_type
    not:
      has:
        not:
          any:
            - regex: '^\|$'
            - matches: string-member
            - matches: string-union
rule:
  any:
    - kind: type_alias_declaration
      has:
        field: value
        matches: string-union
    - kind: enum_declaration
      regex: '^const\s+enum\b'
