id: kit-imports-tsx
language: tsx
severity: error
message: "kit/** is generic and takes props only: it imports nothing from `@/stores`, `@/organisms`, `@/pages`, `@/api`, `@/lib/live` or `react-router` (L1)."
files:
  - "ui/src/kit/**"
# Covers imports, `export … from` and `import(…)`. Only the `@/` aliases are matched.
utils:
  banned:
    kind: string
    regex: '^["''](@/(stores|organisms|pages|api|lib/live)|react-router)(/[^"'']*)?["'']$'
rule:
  any:
    - any:
        - kind: import_statement
        - kind: export_statement
      has:
        field: source
        matches: banned
    - kind: call_expression
      all:
        - has:
            field: function
            kind: import
        - has:
            field: arguments
            has:
              matches: banned
