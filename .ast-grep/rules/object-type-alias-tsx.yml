id: object-type-alias-tsx
language: tsx
severity: error
message: "An object shape is an `interface`, not a `type` alias (T1)."
files:
  - "ui/src/components/**"
  - "ui/src/stores/**"
  - "ui/src/features/**"
  - "ui/src/mobile/**"
  - "ui/src/App.tsx"
  - "ui/src/App.test.tsx"
# A mapped type (`{ [K in X]: Y }`) has no interface form and is allowed.
rule:
  kind: type_alias_declaration
  has:
    field: value
    kind: object_type
    not:
      has:
        kind: index_signature
        has:
          kind: mapped_type_clause
