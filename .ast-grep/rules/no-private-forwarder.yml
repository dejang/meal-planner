id: no-private-forwarder
language: rust
severity: error
message: "Private method `$NAME` only forwards its arguments. Remove this indirection and call the underlying operation directly."
note: "Checks inherent methods with a single direct call, return, or awaited call. Explicit adaptations, conventional constructors/conversions, and generic calls are excluded; Rust types are not resolved."
labels:
  NAME:
    style: primary
utils:
  argument:
    any:
      - kind: identifier
      - kind: self
  comment:
    any:
      - kind: line_comment
      - kind: block_comment
  direct-callee:
    any:
      - kind: identifier
      - kind: scoped_identifier
      - kind: field_expression
        regex: '^self(\s*\.\s*(r#)?[\pL\pN_]+)+$'
    not:
      any:
        - kind: identifier
          regex: '^(r#)?\p{Lu}'
        - kind: scoped_identifier
          has:
            field: name
            regex: '^(r#)?(\p{Lu}|new$|with_capacity$|from$|try_from$)'
        - kind: field_expression
          has:
            field: field
            regex: '^(into|try_into|as_ref|as_mut|as_str|as_slice|to_owned|to_string|clone|borrow|borrow_mut)$'
  forward-call:
    kind: call_expression
    all:
      - has:
          field: function
          pattern: $CALLEE
      - has:
          field: arguments
          pattern: $ARGUMENTS
  forward-value:
    any:
      - matches: forward-call
      - kind: await_expression
        has:
          matches: forward-call
  forward-operation:
    any:
      - matches: forward-value
      - kind: return_expression
        has:
          matches: forward-value
  argument-in-parameters:
    all:
      - matches: argument
        pattern: $ARG
      - inside:
          kind: function_item
          stopBy:
            kind: function_item
          has:
            field: parameters
            has:
              any:
                - kind: parameter
                  has:
                    field: pattern
                    pattern: $ARG
                - kind: self_parameter
                  has:
                    pattern: $ARG
                    kind: self
  parameter-not-forwarded:
    kind: parameter
    all:
      - has:
          field: pattern
          pattern: $PARAM
      - not:
          inside:
            kind: function_item
            stopBy:
              kind: function_item
            has:
              field: body
              has:
                kind: arguments
                pattern: $ARGUMENTS
                has:
                  pattern: $PARAM
                stopBy: end
  reordered-parameter:
    # Adjacent parameter pairs must retain their order in the call.
    kind: parameter
    all:
      - has:
          field: pattern
          pattern: $RIGHT
      - follows:
          kind: parameter
          has:
            field: pattern
            pattern: $LEFT
          stopBy: end
      - inside:
          kind: function_item
          stopBy:
            kind: function_item
          has:
            field: body
            has:
              kind: arguments
              pattern: $ARGUMENTS
              has:
                pattern: $RIGHT
                precedes:
                  pattern: $LEFT
                  stopBy: end
              stopBy: end
rule:
  all:
    - kind: function_item
      inside:
        kind: declaration_list
        inside:
          kind: impl_item
          not:
            has:
              field: trait
              regex: '.'
      not:
        any:
          - has:
              kind: visibility_modifier
              not:
                regex: '^pub\s*\(\s*(in\s+)?self\s*\)$'
          - has:
              kind: function_modifiers
              regex: '\b(unsafe|extern)\b'
    - has:
        field: name
        pattern: $NAME
    - has:
        field: body
        has:
          all:
            - any:
                - matches: forward-operation
                - kind: expression_statement
                  has:
                    matches: forward-operation
            # Exactly one statement or tail expression; comments do not count.
            - nthChild:
                position: 1
                ofRule:
                  not:
                    matches: comment
            - nthChild:
                position: 1
                reverse: true
                ofRule:
                  not:
                    matches: comment
    - has:
        field: parameters
        not:
          has:
            kind: parameter
            any:
              - not:
                  has:
                    field: pattern
                    kind: identifier
              - matches: parameter-not-forwarded
              - matches: reordered-parameter
    - has:
        field: body
        has:
          kind: arguments
          pattern: $ARGUMENTS
          stopBy: end
          not:
            has:
              all:
                - pattern: $_ARGUMENT
                - not:
                    matches: comment
                - any:
                    - not:
                        matches: argument-in-parameters
                    - all:
                        - pattern: $DUPLICATE
                        - precedes:
                            pattern: $DUPLICATE
                            stopBy: end
                    - kind: self
                      follows:
                        matches: argument
                        stopBy: end
    - not:
        has:
          field: body
          has:
            kind: call_expression
            has:
              field: function
              any:
                - pattern: self.$NAME
                - pattern: Self::$NAME
            stopBy: end
constraints:
  CALLEE:
    matches: direct-callee
