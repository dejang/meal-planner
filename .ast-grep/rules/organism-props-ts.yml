id: organism-props-ts
language: ts
severity: error
message: "An organism's props parameter is typed `Keys<…>`: ids, names and `() => void` callbacks, never an entity (L9)."
files:
  - "ui/src/organisms/**"
# A component is a function whose own name, or the name of the variable it is assigned to,
# starts with an uppercase letter. A component wrapped in a call (`memo(…)`) is not seen.
utils:
  component:
    any:
      - any:
          - kind: function_declaration
          - kind: function_expression
        has:
          field: name
          regex: '^[A-Z]'
      - any:
          - kind: arrow_function
          - kind: function_expression
        inside:
          kind: variable_declarator
          field: value
          has:
            field: name
            regex: '^[A-Z]'
  keys:
    kind: type_annotation
    has:
      kind: generic_type
      has:
        field: name
        regex: '^Keys$'
rule:
  any:
    - any:
        - kind: required_parameter
        - kind: optional_parameter
      not:
        has:
          field: type
          matches: keys
      inside:
        kind: formal_parameters
        inside:
          matches: component
    - kind: identifier
      inside:
        field: parameter
        kind: arrow_function
        matches: component
