id: store-imports-ts
language: ts
severity: error
message: "Stores are imported only by features/**, mobile/** and App.tsx (L3)."
files:
  - "ui/src/components/**"
  - "ui/src/theme/**"
# Covers imports, `export … from` and `import(…)`, matching only the `@/` alias.
utils:
  banned:
    kind: string
    regex: '^["'']@/stores(/[^"'']*)?["'']$'
rule:
  any:
    - any:
        - kind: import_statement
        - kind: export_statement
      has:
        field: source
        matches: banned
    - kind: call_expression
      all:
        - has:
            field: function
            kind: import
        - has:
            field: arguments
            has:
              matches: banned
