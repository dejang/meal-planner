    fn helper() {}
    impl Worker {
        fn run(&self) { helper(); register(helper); }
    }
  - |
    fn helper() {}
    impl Worker {
        fn run(&self) { helper(); invoke!(helper); }
    }
  - |
    fn helper() {}
    impl Worker {
        fn run(&self) { let helper = || {}; helper(); }
    }
  - |
    fn helper() {}
    impl Worker {
        fn run(&self, helper: fn()) { helper(); }
    }
  - |
    fn helper() {}
    impl Worker {
        fn run(&self) { helper(); self::helper(); }
    }
  - |
    fn helper() {}
    impl Worker {
        fn run(&self) { helper(); { { helper(); } } }
    }
