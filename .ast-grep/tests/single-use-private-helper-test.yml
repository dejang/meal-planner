id: single-use-private-helper
valid:
  - |
    fn helper() {}
    impl Worker {
        fn run(&self) { helper(); helper(); }
    }
  - |
    fn helper() {}
    impl Worker {
        fn run(&self) {
            if ready() { helper(); }
            else { helper(); }
        }
    }
  - |
    fn helper() {}
    impl Worker {
        fn first(&self) { helper(); }
        fn second(&self) { helper(); }
    }
  - |
    fn helper() {}
    fn first() { helper(); }
    fn second() { helper(); }
  - |
    pub fn helper() {}
    impl Worker { fn run(&self) { helper(); } }
  - |
    pub(crate) fn helper() {}
    impl Worker { fn run(&self) { helper(); } }
