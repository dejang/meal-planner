    fn helper() {}
    impl Worker {
        fn run(&self) { use self::helper as alias; alias(); helper(); }
    }
  - |
    mod first {
        fn helper() {}
        impl Worker { fn run(&self) { helper(); } }
    }
    mod second { fn helper() {} }
  - |
    mod first { fn helper() {} }
    mod second {
        fn helper() {}
        impl Worker { fn run(&self) { helper(); } }
    }
  - |
    fn helper() {}
    mod child {
        use external::*;
        impl Worker { fn run(&self) { helper(); } }
    }
  - |
