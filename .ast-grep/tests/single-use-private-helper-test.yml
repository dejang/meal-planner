    fn helper() {}
    impl Worker { fn run(&self) { helper(); register(Callbacks { helper }); } }
  - |
    fn helper() {}
    impl Worker {
        fn run(&self, Callbacks { helper }: Callbacks) { helper(); }
    }
  - |
    extern "C" fn helper() {}
    impl Worker { fn run(&self) { helper(); } }
  - |
    pub(self) fn helper() {}
    impl Worker { fn run(&self) { helper(); helper(); } }
invalid:
  - |
    fn helper() {}
    impl Worker { fn run(&self) { helper(); } }
  - |
    impl Worker { fn run(&self) { helper(); } }
    fn helper() {}
  - |
    fn helper(value: usize) -> usize { value + 1 }
    impl Worker {
        fn run(&self, value: usize) -> usize { helper(value) }
    }
  - |
    fn helper() {}
    fn run() { helper(); }
  - |
    fn first() { second(); }
    fn second() { third(); }
    fn third() {}
    impl Worker { fn run(&self) { first(); } }
  - |
    impl Worker { fn run(&self) { first(); } }
    fn third() {}
    fn second() { third(); }
    fn first() { second(); }
  - |
    fn helper() {}
    impl Worker {
        fn run(&self) {
            if ready() { for _ in 0..3 { helper(); } }
        }
    }
  - |
    async fn helper(value: usize) -> usize { value + 1 }
    impl Worker {
        async fn run(&self, value: usize) -> usize { helper(value).await }
    }
  - |
    fn helper<T: Default>() -> T { T::default() }
    impl Worker { fn run(&self) -> usize { helper::<usize>() } }
  - |
    mod worker {
        fn helper() {}
        impl Worker { fn run(&self) { helper(); } }
    }
  - |
    fn helper() {}
    impl Worker {
        fn run(&self) {
            // helper() in a comment is not a call.
            let _ = "helper()";
            helper();
        }
    }
  - |
    fn helper() {}
    impl Worker { fn run(&self) { self::helper(); } }
  - |
    fn helper<T: Default>() -> T { T::default() }
    impl Worker { fn run(&self) -> usize { self::helper::<usize>() } }
  - |
    mod worker {
        fn helper() {}
        impl Worker { fn run(&self) { self::helper(); } }
    }
  - |
    mod outer {
        mod inner {
            fn helper() {}
            impl Worker { fn run(&self) { helper(); } }
        }
    }
  - |
    fn helper() {}
    impl Worker { fn run(&self) { let action = || helper(); action(); } }
  - |
    unsafe fn helper() {}
    impl Worker { fn run(&self) { unsafe { helper(); } } }
  - |
    fn r#type() {}
    impl Worker { fn run(&self) { r#type(); } }
  - |
    pub(self) fn helper() {}
    impl Worker { fn run(&self) { helper(); } }
  - |
    pub(in self) fn helper() {}
    impl Worker { fn run(&self) { helper(); } }
