    mod child;
    impl Worker { fn run(&self) { helper(); } }
  - |
    fn helper() {}
    impl Worker { fn run(&self) { elsewhere::helper(); } }
  - |
    fn helper() {}
    impl Worker { fn run(&self) { self.helper(); } }
