[package]
name = "meal_planner_desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
meal_planner_core = { path = "../crates/core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
scraper = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.24", features = ["derive", "uuid"] }
specta-typescript = "0.0.11"
tauri = { version = "2.12.5", features = ["specta"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-store = "2.5.1"
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }
tokio = { version = "1", features = ["fs"] }
url = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
