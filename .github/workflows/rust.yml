on: [push, pull_request, workflow_dispatch]

name: CI

env:
  # --cfg=web_sys_unstable_apis is required to enable the web_sys clipboard API which egui_web uses
  # https://rustwasm.github.io/wasm-bindgen/api/web_sys/struct.Clipboard.html
  # https://rustwasm.github.io/docs/wasm-bindgen/web-sys/unstable-apis.html
  RUSTFLAGS: -D warnings --cfg=web_sys_unstable_apis
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      WINIT_UNIX_BACKEND: "x11"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir ui run typecheck
      - run: pnpm --dir ui test
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo build --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --doc
      - run: pnpm tauri build --no-bundle --debug

  check_wasm:
    name: Check wasm32
    runs-on: ubuntu-latest
    env:
      WINIT_UNIX_BACKEND: "x11"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - run: cargo check --locked -p meal_planner --all-features --lib --target wasm32-unknown-unknown

  trunk:
    name: trunk
    runs-on: ubuntu-latest
    env:
      WINIT_UNIX_BACKEND: "x11"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - name: Download and install Trunk binary
        run: wget -qO- https://github.com/thedodd/trunk/releases/latest/download/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf-
      - name: Build
        run: ../trunk build
        working-directory: legacy

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      WINIT_UNIX_BACKEND: "x11"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            extension: ""
            use_cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            extension: ""
            use_cross: true

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            extension: ""
            use_cross: true

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ""
            use_cross: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      # Use a prebuilt cross binary so project RUSTFLAGS are not applied while
      # compiling cross itself. Native macOS and Windows builds use cargo.
      - name: Install cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@cross
        env:
          RUSTFLAGS: ""

      - name: Cross-compile
        if: ${{ matrix.use_cross }}
        run: cross build --locked -p meal_planner --verbose --release --target=${{ matrix.target }}

      - name: Build natively
        if: ${{ !matrix.use_cross }}
        run: cargo build --locked -p meal_planner --verbose --release --target=${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          source="target/${{ matrix.target }}/release/meal_planner${{ matrix.extension }}"
          destination="meal_planner-${{ matrix.target }}${{ matrix.extension }}"
          cp "$source" "$destination"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meal_planner-${{ matrix.target }}
          path: meal_planner-${{ matrix.target }}${{ matrix.extension }}
          if-no-files-found: error

      - name: Upload binary to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: meal_planner-${{ matrix.target }}${{ matrix.extension }}
          asset_name: meal_planner-${{ matrix.target }}${{ matrix.extension }}
          tag: ${{ github.ref_name }}
          overwrite: true
