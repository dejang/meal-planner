on: [push, pull_request, workflow_dispatch]

name: CI

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --global --allow-build=@ast-grep/cli @ast-grep/cli@0.41.0
      - run: ./check.sh

  ios:
    name: Build iOS simulator app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-apple-ios-sim
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri ios build --target aarch64-sim

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            extension: ""

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: ""

          - os: ubuntu-24.04-arm
            target: armv7-unknown-linux-gnueabihf
            extension: ""

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ""

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe

    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux' && matrix.target != 'armv7-unknown-linux-gnueabihf'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install armv7 cross-build dependencies
        if: matrix.target == 'armv7-unknown-linux-gnueabihf'
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf pkg-config libwebkit2gtk-4.1-dev:armhf libxdo-dev:armhf libssl-dev:armhf librsvg2-dev:armhf libayatana-appindicator3-dev:armhf
          echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc' >> "$GITHUB_ENV"
          echo 'PKG_CONFIG_ALLOW_CROSS=1' >> "$GITHUB_ENV"
          echo 'PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig' >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build desktop app
        run: pnpm tauri build --no-bundle --target ${{ matrix.target }} -- --locked

      - name: Package binary
        shell: bash
        run: |
          source="target/${{ matrix.target }}/release/meal_planner_desktop${{ matrix.extension }}"
          destination="meal_planner-${{ matrix.target }}${{ matrix.extension }}"
          cp "$source" "$destination"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meal_planner-${{ matrix.target }}
          path: meal_planner-${{ matrix.target }}${{ matrix.extension }}
          if-no-files-found: error

      - name: Upload binary to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: meal_planner-${{ matrix.target }}${{ matrix.extension }}
          asset_name: meal_planner-${{ matrix.target }}${{ matrix.extension }}
          tag: ${{ github.ref_name }}
          overwrite: true
