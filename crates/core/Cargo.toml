[package]
name = "meal_planner_core"
version = "0.1.0"
edition = "2021"

[features]
fakes = []

[dependencies]
async-trait = "0.1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "uuid"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
pollster = "0.4"
serde_json = "1"
